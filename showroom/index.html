<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#07100d" />
  <title>Virtual EV Showroom | EasyEV AI</title>
  <meta name="description" content="Explore electric cars, scooters, and three-wheelers with an Agora-powered virtual EV specialist." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="preload" as="image" href="/showroom-assets/cars/punch-ev/images/frame-00.jpg" fetchpriority="high" />
  <link rel="stylesheet" href="/showroom-assets/vendor/pannellum.css" />
  <link rel="stylesheet" href="/showroom/showroom.css?v=20260905-2" />
</head>
<body>
  <main id="showroom-app" aria-label="Virtual EV showroom"></main>
  <noscript>This showroom needs JavaScript enabled.</noscript>
  <script src="/showroom-assets/vendor/pannellum.js" defer></script>
  <script src="/showroom-assets/js/viewer360.js?v=20260905-2" defer></script>
  <script src="/client/platform-language.js?v=20260908-1" defer></script>
  <script src="/agora-client.bundle.js?v=20260905-2" defer></script>
  <script type="module" src="/showroom/showroom.js?v=20260905-2"></script>
  <style>
    .stage-heading {
      align-items: center !important;
    }
    .vr-showroom-tour-cta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      height: 64px;
      padding: 0 38px;
      border: 1.5px solid rgba(130, 255, 157, .70);
      border-radius: 16px;
      background: #52f47c;
      box-shadow: 0 10px 32px rgba(22, 191, 83, .34);
      color: #04170b;
      font: 800 16px/1 Figtree, Inter, system-ui, sans-serif;
      text-decoration: none;
      white-space: nowrap;
      transition: transform .18s ease, background-color .18s ease, box-shadow .18s ease;
      cursor: pointer;
    }
    .vr-showroom-tour-cta:hover,
    .vr-showroom-tour-cta:focus-visible {
      background: #75ff99;
      box-shadow: 0 12px 38px rgba(28, 236, 92, .45);
      transform: translateY(-2px);
    }
    .vr-showroom-tour-cta:focus-visible {
      outline: 2px solid #16bf53;
      outline-offset: 2px;
    }
    .vr-showroom-tour-cta span {
      font-size: 21px;
      line-height: 1;
      display: inline-block;
      transition: transform .18s ease;
    }
    .vr-showroom-tour-cta:hover span {
      transform: translateX(3px);
    }
    @media (max-width: 768px) {
      .vr-showroom-tour-cta {
        height: 38px;
        padding: 0 16px;
        font-size: 12.5px;
      }
    }
    @media (prefers-reduced-motion: reduce) {
      .vr-showroom-tour-cta,
      .vr-showroom-tour-cta span { transition: none; }
    }
  </style>
  <script>
    setTimeout(function() {
      var ls = document.getElementById('loading-screen');
      if (ls) {
        ls.classList.add('is-hidden');
        setTimeout(function() { if (ls.parentNode) ls.remove(); }, 350);
      }
    }, 800);
  </script>
</body>
</html>
